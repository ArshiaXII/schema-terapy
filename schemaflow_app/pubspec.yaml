name: myschema_app
description: "MySchema - A comprehensive Flutter app for schema therapy assessment and analysis"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # State Management
  provider: ^6.1.1

  # HTTP & API
  http: ^1.1.0

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  purchases_flutter: ^9.6.2
  url_launcher: ^6.2.0

  # Animations & UI Effects
  lottie: ^2.7.0
  shimmer: ^3.0.0

  # Export & File Handling
  pdf: ^3.10.0
  csv: ^6.0.0
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: false
  ios: true
  image_path: assets/icons/app_icon.png
  remove_alpha_ios: true


flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/

  # App Icons
  # To generate app icons, use flutter_launcher_icons package
  
  # Assets
  # assets:
  #   - images/
  #   - icons/
  
  # Fonts
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
  #       - asset: fonts/CustomFont-Bold.ttf
  #         weight: 700
