name: schemaflow_app
description: "SchemaFlow: Your Path to Self-Understanding - A comprehensive Flutter app for schema therapy assessment and analysis"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  
  # State Management
  provider: ^6.1.1

  # HTTP & API
  http: ^1.1.0

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # App Icons
  # To generate app icons, use flutter_launcher_icons package
  
